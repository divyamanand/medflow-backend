name: Deploy to EC2

on:
  push:
    branches: 
      - main

jobs:
  deploy:
    name: Deploy Node.js App to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Add SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Install Dependencies (Local)
        run: npm install

      - name: Build Project (Local)
        run: npm run build

      - name: Upload Project to EC2
        run: |
          rsync -avz -e "ssh -i key.pem -o StrictHostKeyChecking=no" \
          --exclude node_modules \
          --exclude .git \
          ./ ubuntu@${{ secrets.REMOTE_HOST }}:/home/ubuntu/hospital-app/

      - name: Deploy on EC2
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.REMOTE_HOST }} << 'EOF'

          cd ~/hospital-app

          echo "🔹 Writing environment variables..."
          cat <<EOT > .env
          ${{ vars.ENV_FILE_CONTENT }}
          EOT

          echo "🔹 Installing dependencies..."
          npm install --omit=dev

          echo "🔹 Restarting PM2..."
          pm2 delete hospital 2>/dev/null || true
          pm2 start dist/main.js --name hospital

          echo "🔹 Setting PM2 startup..."
          pm2 save
          pm2 startup systemd -u \$USER --hp \$HOME

          echo "🔹 Setting up NGINX reverse proxy..."
          sudo bash -c 'cat << "EOF2" > /etc/nginx/sites-available/hospital
          server {
              listen 80;

              server_name _;
              
              location / {
                  proxy_pass http://127.0.0.1:8081;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host \$host;
              }
          }
          EOF2'

          sudo ln -sf /etc/nginx/sites-available/hospital /etc/nginx/sites-enabled/hospital
          sudo nginx -t && sudo systemctl restart nginx

          echo "Deployment completed on EC2 ✔"
          EOF
