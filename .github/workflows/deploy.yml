name: Node.js CI/CD (EC2 Ubuntu Deployment)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js locally (for build)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3️⃣ Install dependencies (for build)
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build project locally
      - name: Build Project
        run: npm run build

      # 5️⃣ Upload project to EC2
      - name: Upload project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./"
          target: "/home/ubuntu/hospital-app"
          port: 22
          timeout: 90s
          overwrite: true

      # 6️⃣ EC2 remote deployment
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 90s
          command_timeout: 15m
          script: |
            set -eux

            cd /home/ubuntu/hospital-app

            echo "🔧 Ensuring Node.js installed..."
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            echo "🔧 Ensuring PM2 installed..."
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            echo "📝 Writing .env file..."
            cat <<EOF > .env
            ${{ vars.ENV_FILE_CONTENT }}
            EOF

            echo "📦 Running npm install on EC2..."
            npm install

            echo "🏗 Running npm run build on EC2..."
            npm run build

            echo "🚀 Starting PM2 app: medflow"
            if pm2 describe medflow >/dev/null 2>&1; then
              pm2 restart medflow --update-env
            else
              pm2 start dist/main.js --name medflow
              sudo pm2 startup systemd -u ubuntu --hp /home/ubuntu
              pm2 save
            fi

            echo "🎉 Deployment Successful!"
