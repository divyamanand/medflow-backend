name: Node.js CI/CD (EC2 Ubuntu Deployment)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js (for local build/test)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies locally (optional)
      - name: Install dependencies locally
        run: npm install

      # 4️⃣ Copy project to EC2
      - name: Upload project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./"
          target: "/home/ubuntu/hospital-app"
          port: 22
          timeout: 90s
          overwrite: true

      # 5️⃣ Deploy on EC2 via SSH
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 90s
          command_timeout: 15m
          script: |
            set -eux

            cd /home/ubuntu/hospital-app

            echo "🔧 Installing Node.js if missing..."
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            echo "🔧 Installing PM2 if missing..."
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            echo "📝 Writing .env from GitHub Secrets..."
            cat <<EOF > .env
            ${{ vars.ENV_FILE_CONTENT}}
            EOF

            echo "📦 Installing production node modules..."
            npm ci --only=production

            echo "🚀 Starting or Reloading Node.js App with PM2..."

            if pm2 describe hospital-app >/dev/null 2>&1; then
              pm2 reload hospital-app
            else
              pm2 start index.js --name hospital-app
              sudo pm2 startup systemd -u ubuntu --hp /home/ubuntu
              pm2 save
            fi

            echo "🧽 Cleaning PM2 list..."
            pm2 save

            echo "🎉 Deployment Successful!"
